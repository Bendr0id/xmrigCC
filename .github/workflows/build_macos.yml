name: macOS Build

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master, dev ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [x86_64, arm64]
    steps:
      - uses: actions/checkout@v4
      - name: App version
        id: appver
        run: |
          v=$(sed -n 's/^#define APP_VERSION[[:space:]]*"\([^"]*\)".*/\1/p' src/version.h | head -1)
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Prepare
        run: |
          brew install cmake wget automake libtool autoconf
      - name: Build Dependencies
        run: |
          cd scripts
          chmod +x build_deps.sh
          # Native arm64 deps for arm64; Rosetta x86_64 for Intel target so .a
          # archives match CMAKE_OSX_ARCHITECTURES (same tree as HWLOC/UV).
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            arch -x86_64 ./build_deps.sh
          else
            ./build_deps.sh
          fi
          cd ..
      - name: Build for ${{ matrix.arch }}
        run: |
          cmake -Bbuild -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} -DXMRIG_DEPS=${{ github.workspace }}/scripts/deps
          cmake --build build -- -j$(sysctl -n hw.ncpu)
      - name: Package (full + miner_only, same as Linux build_package.sh)
        id: bundle
        run: |
          VERSION="${{ steps.appver.outputs.version }}"
          ARCH="${{ matrix.arch }}"
          TAR="xmrigCC-${VERSION}-macos-${ARCH}.tar.gz"
          MINER_ONLY="xmrigCC-miner_only-${VERSION}-macos-${ARCH}.tar.gz"
          mkdir -p release/miner/scripts release/server
          cp build/xmrigMiner build/xmrigDaemon src/config.json release/miner/
          cp scripts/randomx_boost.sh scripts/enable_1gb_pages.sh release/miner/scripts/
          cp build/xmrigServer index.html src/config_cc.json release/server/
          cp src/config.json release/server/default_miner_config.json
          if [ -d build/client-updates ]; then
            cp -R build/client-updates release/server/
          fi
          tar -czvf "$TAR" -C release miner server
          ( cd release/miner && tar -czvf "../../$MINER_ONLY" * )
          echo "tarball=$TAR" >> "$GITHUB_OUTPUT"
          echo "miner_only=$MINER_ONLY" >> "$GITHUB_OUTPUT"
      - name: Upload full tarball
        uses: actions/upload-artifact@v4
        with:
          name: xmrigCC-${{ steps.appver.outputs.version }}-macos-${{ matrix.arch }}
          path: ${{ steps.bundle.outputs.tarball }}
      - name: Upload miner_only tarball
        uses: actions/upload-artifact@v4
        with:
          name: xmrigCC-miner_only-${{ steps.appver.outputs.version }}-macos-${{ matrix.arch }}
          path: ${{ steps.bundle.outputs.miner_only }}
