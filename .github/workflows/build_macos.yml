name: macOS Build

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master, dev ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [x86_64, arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare
        run: |
          brew install cmake wget automake libtool autoconf
      - name: Build Dependencies
        run: |
          cd scripts
          chmod +x build_deps.sh
          # Native arm64 deps for arm64; Rosetta x86_64 for Intel target so .a
          # archives match CMAKE_OSX_ARCHITECTURES (same tree as HWLOC/UV).
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            arch -x86_64 ./build_deps.sh
          else
            ./build_deps.sh
          fi
          cd ..
      - name: Build for ${{ matrix.arch }}
        run: |
          cmake -Bbuild -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} -DXMRIG_DEPS=${{ github.workspace }}/scripts/deps
          cmake --build build -- -j$(sysctl -n hw.ncpu)
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xmrig-${{ matrix.arch }}
          path: build/xmrigMiner
      - name: Bundle Artifacts
        run: |
          mkdir -p bundle
          cp src/config.json build/xmrigMiner build/xmrigDaemon bundle/
          tar -czvf xmrig-${{ matrix.arch }}.tar.gz -C bundle .
      - name: Upload Bundle
        uses: actions/upload-artifact@v4
        with:
          name: xmrig-bundle-${{ matrix.arch }}
          path: xmrig-${{ matrix.arch }}.tar.gz
