name: Build XMRigCC Windows x64

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch: # 允許在網頁上手動點擊執行

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install vcpkg dependencies
      run: |
        vcpkg install openssl:x64-windows libuv:x64-windows hwloc:x64-windows

    - name: Configure CMake
      run: |
        cmake -B build -G "Visual Studio 17 2022" -A x64 `
          -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake `
          -DCMAKE_BUILD_TYPE=Release

    - name: Build XMRigCC
      run: |
        cmake --build build --config Release

    - name: Prepare Artifacts
      run: |
        mkdir dist
        # 複製編譯出來的執行檔（依專案結構可能在 Release 或 build 根目錄，這裡做全面搜群並複製）
        Get-ChildItem -Path build -Filter *.exe -Recurse | Copy-Item -Destination dist/
        # 複製必要的動態連結庫 (DLL)
        Get-ChildItem -Path C:/vcpkg/packages -Filter *.dll -Recurse | Where-Object { $_.FullName -notlike "*debug*" -and $_.FullName -like "*bin*" } | Copy-Item -Destination dist/ -ErrorAction SilentlyContinue

    - name: Upload Build Output
      uses: actions/upload-artifact@v4
      with:
        name: XMRigCC-Win64
        path: dist/
